name: Generate contribution graph

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aariso0-profile-content
  cancel-in-progress: false

jobs:
  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate contribution graph
        uses: alexcerezo/activity-graph@v1
        with:
          username: Aariso0
          token: ${{ secrets.GITHUB_TOKEN }}
