name: Weekly profile refresh

on:
  schedule:
    # Every Monday at 03:00 UTC (08:30 IST).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# One workflow owns the branch, so one group is enough.
concurrency:
  group: profile-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate GitHub statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Aariso0&show_icons=true&hide_border=true&theme=github_dark&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Aariso0&layout=compact&hide_border=true&theme=github_dark&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Update recently pushed repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Aariso0
        run: python3 scripts/update_recent_repos.py

      - name: Commit cards and recent repositories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Profile content is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile cards and recent repositories"
          git pull --rebase
          git push

      # The action generates the SVG files, injects them into README.md between
      # the ACTIVITY-GRAPH markers, and commits and pushes the result itself.
      - name: Generate contribution graph
        uses: alexcerezo/activity-graph@v1
        with:
          username: Aariso0
          token: ${{ secrets.GITHUB_TOKEN }}
