<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Aariso0 — Developer and builder</title>
  <desc id="desc">A friendly cartoon robot beside a terminal, with the words building useful things, one experiment at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.58" stop-color="#182b45"/>
      <stop offset="1" stop-color="#263b5b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203a57"/>
      <stop offset="1" stop-color="#142438"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#c9d8eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07111f" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="1130" cy="45" r="115" fill="#5eead4" opacity=".08"/>
  <circle cx="1010" cy="315" r="155" fill="#fbbf24" opacity=".07"/>
  <path d="M0 285 C210 245 310 345 520 300 S850 245 1280 300 V360 H0Z" fill="#0b1422" opacity=".24"/>
  <g opacity=".22" stroke="#9bb7d5" stroke-width="2" fill="none">
    <path d="M55 52h70m-35-35v70M850 70h48m-24-24v48M740 290h62m-31-31v62"/>
    <circle cx="180" cy="290" r="4" fill="#9bb7d5"/><circle cx="920" cy="115" r="4" fill="#9bb7d5"/>
  </g>
  <g transform="translate(82 78)">
    <rect x="0" y="0" width="620" height="204" rx="18" fill="url(#screen)" stroke="#49617f" stroke-width="2" filter="url(#shadow)"/>
    <path d="M0 18Q0 0 18 0H602Q620 0 620 18V43H0Z" fill="#314966"/>
    <circle cx="25" cy="22" r="6" fill="#fb7185"/><circle cx="47" cy="22" r="6" fill="#fbbf24"/><circle cx="69" cy="22" r="6" fill="#5eead4"/>
    <text x="310" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d4e1f1" opacity=".8">~/ideas-that-work</text>
    <text x="38" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#5eead4">$</text>
    <text x="65" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#f1f5f9"> build something useful</text>
    <text x="38" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9fb5ce">&gt; curiosity.exe --make-it-real</text>
    <rect x="38" y="151" width="12" height="20" rx="2" fill="#fbbf24"/>
    <path d="M65 162h185" stroke="#49617f" stroke-width="4" stroke-linecap="round"/>
    <path d="M265 162h95" stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>
  <g transform="translate(830 58)" filter="url(#shadow)">
    <!-- antenna -->
    <path d="M125 42V16" stroke="#d8e5f4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="12" r="12" fill="#fbbf24" stroke="#fff1b8" stroke-width="4"/>
    <!-- ears -->
    <rect x="17" y="105" width="28" height="62" rx="13" fill="#8ca8c8"/>
    <rect x="205" y="105" width="28" height="62" rx="13" fill="#8ca8c8"/>
    <!-- head -->
    <rect x="34" y="43" width="182" height="158" rx="48" fill="url(#bot)" stroke="#ffffff" stroke-width="4"/>
    <rect x="54" y="69" width="142" height="93" rx="30" fill="#1a2d45"/>
    <ellipse cx="94" cy="112" rx="11" ry="15" fill="#5eead4"/>
    <ellipse cx="156" cy="112" rx="11" ry="15" fill="#5eead4"/>
    <path d="M105 139q20 18 40 0" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- body -->
    <rect x="66" y="190" width="118" height="82" rx="28" fill="#dce8f5" stroke="#ffffff" stroke-width="4"/>
    <rect x="96" y="211" width="58" height="34" rx="12" fill="#29415f"/>
    <circle cx="125" cy="228" r="8" fill="#5eead4"/>
    <path d="M72 211l-24 25M178 211l24 25" stroke="#dce8f5" stroke-width="15" stroke-linecap="round"/>
    <path d="M93 270v20M157 270v20" stroke="#dce8f5" stroke-width="15" stroke-linecap="round"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#f8fafc">
    <text x="82" y="326" font-size="14" letter-spacing="3" fill="#9fb5ce">CODE  ·  CREATE  ·  REPEAT</text>
    <text x="835" y="326" font-size="13" fill="#9fb5ce">A curious mind, a growing toolbox.</text>
  </g>
  <path d="M1135 280l12 12-12 12-12-12z" fill="#fbbf24" opacity=".9"/>
  <circle cx="1190" cy="105" r="7" fill="#5eead4"/><circle cx="1160" cy="135" r="4" fill="#fbbf24"/>
</svg>
